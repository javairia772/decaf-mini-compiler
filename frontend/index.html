<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Decaf Compiler — CS-471L UET Lahore</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1e1e1e;color:#d4d4d4;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#1e1e1e}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:3px}

/* header */
#header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:42px;background:#252526;border-bottom:1px solid #1a1a1a;flex-shrink:0}
#header-left{display:flex;align-items:center;gap:10px}
#header-left .logo{font-size:18px;color:#569cd6}
#header-left .title{font-weight:500;font-size:14px;letter-spacing:.02em}
#header-left .sub{font-size:11px;color:#555;margin-left:4px}
#header-right{display:flex;align-items:center;gap:10px}
#api-dot{width:7px;height:7px;border-radius:50%;background:#555;display:inline-block;transition:background .3s}
#api-dot.online{background:#4ec9b0}
#api-dot.offline{background:#f44747}
#api-label{font-size:11px;color:#555}
#sample-select{background:#333;border:1px solid #454545;color:#d4d4d4;border-radius:4px;padding:3px 8px;font-size:12px;cursor:pointer}

/* body */
#body{display:flex;flex:1;overflow:hidden}

/* editor pane */
#editor-pane{width:340px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid #252525}
#editor-header{padding:8px 12px;background:#252526;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between}
#editor-header .fname{font-size:11px;color:#858585;display:flex;align-items:center;gap:6px}
#editor-header .hint{font-size:10px;color:#3a3a3a}
#editor{flex:1;resize:none;border:none;outline:none;background:#1e1e1e;color:#d4d4d4;padding:12px 14px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.7;tab-size:4}
#editor-footer{padding:8px 12px;background:#252526;border-top:1px solid #1a1a1a}
#run-btn{width:100%;padding:7px 0;background:#0e639c;border:none;border-radius:4px;color:#fff;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
#run-btn:hover{background:#1177bb}
#run-btn:disabled{background:#1a3a2a;opacity:.7;cursor:wait}

/* output pane */
#output-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* tabs */
#tabs{display:flex;background:#252526;border-bottom:1px solid #1a1a1a;flex-shrink:0;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:0 16px;height:38px;cursor:pointer;background:transparent;border:none;border-top:1px solid transparent;border-right:1px solid #1a1a1a;color:#858585;font-size:12px;white-space:nowrap;transition:color .15s;font-family:inherit}
.tab:hover{color:#d4d4d4}
.tab.active{background:#1e1e1e;border-top-color:#0e639c;color:#d4d4d4}
.tab-badge{font-size:10px;font-weight:500;padding:2px 5px;border-radius:3px;margin-left:2px}
.tab-badge.pass{background:#1a3a1a;color:#4ec9b0;border:1px solid #2d5a2d}
.tab-badge.fail{background:#3a1a1a;color:#f44747;border:1px solid #5a2d2d}
#pipeline-indicator{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;gap:4px;font-size:11px;color:#3a3a3a}
.pipe-step{color:#3a3a3a}
.pipe-step.pass{color:#2d5a2d}
.pipe-step.fail{color:#5a2d2d}

/* content area */
#content{flex:1;overflow-y:auto;background:#1e1e1e}
#content-inner{padding:20px}

/* error strip */
#error-strip{padding:6px 16px;background:#1a1010;border-top:1px solid #3a1e1e;cursor:pointer;display:none;align-items:center;gap:8px;color:#f44747;font-size:12px;flex-shrink:0}
#error-strip:hover{background:#1e1212}

/* status bar */
#statusbar{height:22px;background:#007acc;display:flex;align-items:center;padding-left:14px;gap:16px;font-size:11px;color:rgba(255,255,255,.8);flex-shrink:0}
.sb-item{display:flex;align-items:center;gap:4px}
.sb-ok{color:#9cdcfe}
.sb-fail{color:#ffaaaa}

/* section head */
.sec-head{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #222}
.sec-head h3{font-size:13px;font-weight:500;color:#d4d4d4}
.sec-head p{font-size:11px;color:#555;margin-top:3px}

/* token chips */
#token-area{line-height:2}
.chip{display:inline-flex;align-items:center;gap:4px;margin:2px 3px;padding:3px 8px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;font-family:monospace;font-size:12px;cursor:default;position:relative}
.chip:hover .chip-tooltip{display:block}
.chip-lex{font-weight:500}
.chip-type{color:#444;font-size:10px}
.chip-tooltip{display:none;position:absolute;bottom:calc(100% + 4px);left:0;background:#333;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:11px;color:#d4d4d4;white-space:nowrap;z-index:10}

/* result banner */
.result-banner{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;padding:6px 14px;border-radius:6px;font-size:13px}
.result-banner.pass{background:#101e10;border:1px solid #2d5a2d;color:#4ec9b0}
.result-banner.fail{background:#1e1010;border:1px solid #5a2d2d;color:#f44747}

/* sub-tabs */
.subtabs{display:flex;gap:6px;margin-bottom:16px}
.stab{padding:4px 14px;border-radius:4px;cursor:pointer;background:transparent;border:1px solid #333;color:#858585;font-size:12px;font-family:inherit;transition:all .15s}
.stab:hover{color:#d4d4d4;border-color:#555}
.stab.active{background:#264f78;border-color:#4a9eff;color:#9cdcfe}

/* tables */
.dtable{width:100%;border-collapse:collapse;font-family:monospace;font-size:12px}
.dtable th{padding:6px 10px;text-align:left;background:#1a1a1a;color:#858585;font-weight:500;font-size:11px;border-bottom:1px solid #333;white-space:nowrap}
.dtable td{padding:4px 10px;border-bottom:1px solid #1e1e1e;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtable tr:nth-child(even) td{background:#141414}
.dtable tr.row-err td{background:#1e1010;color:#f44747}
.dtable tr.row-acc td{background:#101e10;color:#4ec9b0}
.show-more-btn{margin-top:8px;padding:4px 12px;background:transparent;border:1px solid #333;color:#858585;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit}
.show-more-btn:hover{border-color:#555;color:#d4d4d4}

/* first/follow grid */
.ff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.ff-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:8px 10px}
.ff-card-title{color:#dcdcaa;font-size:12px;font-family:monospace;margin-bottom:5px;font-weight:500}
.ff-tags{display:flex;flex-wrap:wrap;gap:3px}
.ff-tag{font-size:11px;padding:1px 6px;background:#252525;color:#4ec9b0;border-radius:3px;font-family:monospace}

/* symbol table */
.kind-badge{font-size:10px;padding:2px 6px;border-radius:3px;background:#1e1e1e;border:1px solid #2a2a2a}
.kind-variable{color:#9cdcfe}
.kind-function{color:#dcdcaa}
.kind-class{color:#4ec9b0}
.kind-parameter{color:#c586c0}
.kind-array{color:#ce9178}
.kind-constant{color:#b5cea8}

/* errors */
.err-list{display:flex;flex-direction:column;gap:8px}
.err-item{display:flex;gap:10px;padding:10px 14px;background:#1a1010;border:1px solid #3a1e1e;border-radius:4px}
.err-type{font-size:10px;font-weight:500;padding:2px 6px;border-radius:3px;background:#2a1414;white-space:nowrap;align-self:flex-start;margin-top:1px}
.err-type.LEXICAL{color:#f44747}
.err-type.SYNTACTIC{color:#ff8c00}
.err-type.SEMANTIC{color:#c586c0}
.err-msg{color:#d4d4d4;font-family:monospace}
.err-loc{color:#555;font-size:11px;margin-left:8px}
.empty-state{display:flex;align-items:center;gap:10px;color:#4ec9b0;padding:20px 0;font-size:13px}

/* raw output */
details summary{color:#555;font-size:12px;cursor:pointer;margin-top:20px}
details pre{margin-top:8px;padding:12px;background:#111;border-radius:6px;font-size:11px;color:#555;overflow:auto;max-height:240px;font-family:monospace}

/* placeholder */
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:#2a2a2a}
.placeholder i{font-size:44px}
.placeholder p{font-size:13px}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="header-left">
    <i class="ti ti-cpu logo"></i>
    <span class="title">Decaf Compiler</span>
    <span class="sub">CS-471L · UET Lahore</span>
  </div>
  <div id="header-right">
    <span id="api-dot"></span>
    <span id="api-label">Checking API...</span>
    <select id="sample-select">
      <option value="">Load sample...</option>
      <option value="basic">Basic class</option>
      <option value="errors">With errors</option>
      <option value="inherit">Inheritance</option>
    </select>
  </div>
</div>

<!-- BODY -->
<div id="body">

  <!-- EDITOR PANE -->
  <div id="editor-pane">
    <div id="editor-header">
      <span class="fname"><i class="ti ti-file-code"></i> source.decaf</span>
      <span class="hint">Ctrl+Enter to run</span>
    </div>
    <textarea id="editor" spellcheck="false">class Main {
    int x;
    void main(int argc) {
        int a;
        a = 5 + 3;
        if (a < 10) {
            return a;
        }
        while (a > 0) {
            a = a - 1;
        }
    }
}</textarea>
    <div id="editor-footer">
      <button id="run-btn" onclick="runCompiler()">
        <i class="ti ti-player-play"></i> Run compiler
      </button>
    </div>
  </div>

  <!-- OUTPUT PANE -->
  <div id="output-pane">

    <!-- TABS -->
    <div id="tabs">
      <button class="tab active" data-tab="tokens" onclick="switchTab('tokens')">
        <i class="ti ti-scan"></i> Lexer
      </button>
      <button class="tab" data-tab="rd" onclick="switchTab('rd')">
        <i class="ti ti-binary-tree"></i> RD Parser
      </button>
      <button class="tab" data-tab="ll1" onclick="switchTab('ll1')">
        <i class="ti ti-table"></i> LL(1)
      </button>
      <button class="tab" data-tab="lalr" onclick="switchTab('lalr')">
        <i class="ti ti-stack-2"></i> LALR(1)
      </button>
      <button class="tab" data-tab="symtable" onclick="switchTab('symtable')">
        <i class="ti ti-database"></i> Symbol Table
      </button>
      <button class="tab" data-tab="errors" onclick="switchTab('errors')">
        <i class="ti ti-bug"></i> Errors
      </button>
      <div id="pipeline-indicator"></div>
    </div>

    <!-- CONTENT -->
    <div id="content">
      <div id="content-inner">
        <div class="placeholder">
          <i class="ti ti-player-play"></i>
          <p>Press Run or Ctrl+Enter to compile</p>
        </div>
      </div>
    </div>

    <!-- ERROR STRIP -->
    <div id="error-strip" onclick="switchTab('errors')">
      <i class="ti ti-bug"></i>
      <span id="error-strip-text"></span>
    </div>

  </div>
</div>

<!-- STATUS BAR -->
<div id="statusbar">
  <span class="sb-item"><i class="ti ti-cpu"></i> Decaf LALR(1) Compiler</span>
  <span id="sb-tokens" class="sb-item" style="display:none"></span>
  <span id="sb-errors" class="sb-item" style="display:none"></span>
  <span id="sb-rd"     class="sb-item" style="display:none"></span>
  <span id="sb-ll1"    class="sb-item" style="display:none"></span>
  <span id="sb-lalr"   class="sb-item" style="display:none"></span>
</div>

<script>
const API = 'http://localhost:5000';
let result = null;
let currentTab = 'tokens';

const TOKEN_COLORS = {
  CLASS:'#569cd6',VOID:'#569cd6',INT:'#569cd6',DOUBLE:'#569cd6',
  BOOL:'#569cd6',STRING:'#569cd6',IF:'#c586c0',ELSE:'#c586c0',
  WHILE:'#c586c0',FOR:'#c586c0',RETURN:'#c586c0',BREAK:'#c586c0',
  NEW:'#c586c0',THIS:'#9cdcfe',PRINT:'#dcdcaa',TRUE:'#4ec9b0',
  FALSE:'#4ec9b0',NULL:'#4ec9b0',IDENTIFIER:'#9cdcfe',
  INT_LITERAL:'#b5cea8',DOUBLE_LITERAL:'#b5cea8',
  STRING_LITERAL:'#ce9178',BOOL_LITERAL:'#4ec9b0',
  PLUS:'#d4d4d4',MINUS:'#d4d4d4',STAR:'#d4d4d4',SLASH:'#d4d4d4',
  PERCENT:'#d4d4d4',ASSIGN:'#d4d4d4',EQ:'#d4d4d4',NEQ:'#d4d4d4',
  LT:'#d4d4d4',LTE:'#d4d4d4',GT:'#d4d4d4',GTE:'#d4d4d4',
  AND:'#d4d4d4',OR:'#d4d4d4',NOT:'#d4d4d4',
  LPAREN:'#ffd700',RPAREN:'#ffd700',LBRACE:'#da70d6',RBRACE:'#da70d6',
  LBRACKET:'#ffd700',RBRACKET:'#ffd700',SEMICOLON:'#d4d4d4',
  COMMA:'#d4d4d4',DOT:'#d4d4d4',EOF:'#555',UNKNOWN:'#f44747',
};

const SAMPLES = {
  basic:`class Main {
    int x;
    void main(int argc) {
        int a;
        a = 5 + 3;
        if (a < 10) {
            return a;
        }
        while (a > 0) {
            a = a - 1;
        }
    }
}`,
  errors:`class Broken {
    int x
    void bad( {
        undeclaredVar = 10;
        return
    }
}`,
  inherit:`class Animal extends Base {
    string name;
    bool alive;
    void speak() {
        Print("hello");
    }
    int getAge() {
        return 5;
    }
}`
};

// ── API health check ───────────────────────────────────────────────────────
fetch(API+'/health')
  .then(r => {
    document.getElementById('api-dot').className = r.ok ? 'online' : 'offline';
    document.getElementById('api-label').textContent = r.ok ? 'API connected' : 'API offline';
  })
  .catch(() => {
    document.getElementById('api-dot').className = 'offline';
    document.getElementById('api-label').textContent = 'API offline';
  });

// ── Sample select ──────────────────────────────────────────────────────────
document.getElementById('sample-select').addEventListener('change', function() {
  if (this.value && SAMPLES[this.value])
    document.getElementById('editor').value = SAMPLES[this.value];
  this.value = '';
});

// ── Ctrl+Enter ─────────────────────────────────────────────────────────────
document.getElementById('editor').addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCompiler(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = this.selectionStart, en = this.selectionEnd;
    this.value = this.value.substring(0,s) + '    ' + this.value.substring(en);
    this.selectionStart = this.selectionEnd = s + 4;
  }
});

// ── Run compiler ───────────────────────────────────────────────────────────
async function runCompiler() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Compiling...';
  setContent(`<div style="display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:#555">
    <i class="ti ti-loader-2" style="font-size:24px"></i>
    <span>Running compiler pipeline...</span>
  </div>`);

  try {
    const res = await fetch(API+'/compile', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ source: document.getElementById('editor').value })
    });
    result = await res.json();
  } catch(e) {
    result = { error: 'Cannot reach API. Make sure Flask is running on port 5000.\n\npython api/app.py' };
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-player-play"></i> Run compiler';
  updateTabBadges();
  updateStatusBar();
  updateErrorStrip();
  updatePipelineIndicator();
  switchTab(currentTab);
}

// ── Tab switching ──────────────────────────────────────────────────────────
function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === id);
  });
  if (!result) return;
  if (result.error) {
    setContent(`<div style="padding:24px;color:#f44747;font-family:monospace;font-size:13px;background:#1a1010;border-radius:6px;white-space:pre-wrap">${esc(result.error)}</div>`);
    return;
  }
  const renders = { tokens:renderTokens, rd:renderRD, ll1:renderLL1, lalr:renderLALR, symtable:renderSymTable, errors:renderErrors };
  if (renders[id]) setContent(renders[id]());
}

function setContent(html) {
  document.getElementById('content-inner').innerHTML = html;
}

// ── Badges ─────────────────────────────────────────────────────────────────
function updateTabBadges() {
  if (!result) return;
  const map = {
    tokens: !result.error,
    rd:     result.rd?.success,
    ll1:    result.ll1?.success,
    lalr:   result.lalr?.success,
    symtable: (result.rd?.symtable?.length > 0),
    errors: !result.errors?.length,
  };
  document.querySelectorAll('.tab').forEach(t => {
    const id = t.dataset.tab;
    const badge = t.querySelector('.tab-badge');
    if (badge) badge.remove();
    if (map[id] !== undefined) {
      const b = document.createElement('span');
      b.className = 'tab-badge ' + (map[id] ? 'pass' : 'fail');
      b.textContent = id === 'errors'
        ? (result.errors?.length ? result.errors.length + ' err' : 'OK')
        : (map[id] ? 'PASS' : 'FAIL');
      t.appendChild(b);
    }
  });
}

function updateStatusBar() {
  if (!result) return;
  const show = (id, html) => { const el = document.getElementById(id); el.style.display='flex'; el.innerHTML=html; };
  show('sb-tokens', `<i class="ti ti-scan"></i> Tokens: ${result.tokens?.length ?? 0}`);
  show('sb-errors', `<i class="ti ti-bug"></i> Errors: ${result.errors?.length ?? 0}`);
  const ok = v => `<span class="${v?'sb-ok':'sb-fail'}">${v?'✓':'✗'}</span>`;
  show('sb-rd',   `RD: ${ok(result.rd?.success)}`);
  show('sb-ll1',  `LL1: ${ok(result.ll1?.success)}`);
  show('sb-lalr', `LALR: ${ok(result.lalr?.success)}`);
}

function updateErrorStrip() {
  const strip = document.getElementById('error-strip');
  const cnt = result?.errors?.length;
  if (cnt && currentTab !== 'errors') {
    strip.style.display = 'flex';
    document.getElementById('error-strip-text').textContent = cnt + ' error(s) detected — click to view';
  } else {
    strip.style.display = 'none';
  }
}

function updatePipelineIndicator() {
  if (!result) return;
  const steps = [
    ['tokens','LEXER'],['rd','RD'],['ll1','LL1'],['lalr','LALR']
  ];
  const map = { tokens:!result.error, rd:result.rd?.success, ll1:result.ll1?.success, lalr:result.lalr?.success };
  let html = '';
  steps.forEach(([id,label], i) => {
    if (i) html += '<span style="color:#333">→</span>';
    const cls = map[id] ? 'pass' : 'fail';
    html += `<span class="pipe-step ${cls}">${label}</span>`;
  });
  document.getElementById('pipeline-indicator').innerHTML = html;
}

// ── Renderers ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderTokens() {
  const tokens = result.tokens || [];
  let chips = '';
  tokens.forEach(t => {
    const col = TOKEN_COLORS[t.type] || '#d4d4d4';
    chips += `<span class="chip">
      <span class="chip-lex" style="color:${col}">${esc(t.lexeme)}</span>
      <span class="chip-type">${esc(t.type)}</span>
      <span class="chip-tooltip">Line ${t.line}, Col ${t.col}</span>
    </span>`;
  });
  return `<div class="sec-head"><h3>Token stream — ${tokens.length} tokens</h3>
    <p>Each chip shows the lexeme and token type. Hover for line / col info.</p></div>
  <div id="token-area">${chips}</div>`;
}

function renderRD() {
  const rd = result.rd || {};
  const cls = rd.success ? 'pass' : 'fail';
  const icon = rd.success ? 'ti-circle-check' : 'ti-circle-x';
  let html = `<div class="sec-head"><h3>Recursive descent parser</h3>
    <p>One parsing routine per non-terminal. Symbol table populated at every declaration and use.</p></div>
  <div class="result-banner ${cls}">
    <i class="ti ${icon}"></i>
    ${rd.success ? 'Parse succeeded' : 'Parse failed'}
  </div>`;
  if (rd.trace?.length) {
    html += `<div class="sec-head" style="margin-top:20px"><h3>Parse log</h3></div>
    <div style="font-family:monospace;font-size:12px;color:#858585;background:#111;border-radius:6px;padding:12px;max-height:180px;overflow-y:auto">
      ${rd.trace.slice(0,40).map(l => `<div>${esc(l)}</div>`).join('')}
    </div>`;
  }
  html += `<div class="sec-head" style="margin-top:20px"><h3>Symbol table after RD pass</h3></div>`;
  html += buildSymTable(rd.symtable);
  return html;
}

function renderLL1() {
  let html = `<div class="sec-head"><h3>LL(1) predictive parser</h3>
    <p>Table-driven with explicit stack. FIRST and FOLLOW sets computed algorithmically.</p></div>
  <div class="subtabs">
    <button class="stab active" id="stab-trace" onclick="ll1Sub('trace')">Parse trace</button>
    <button class="stab" id="stab-ff" onclick="ll1Sub('ff')">FIRST / FOLLOW</button>
    <button class="stab" id="stab-table" onclick="ll1Sub('table')">Parsing table</button>
  </div>
  <div id="ll1-content"></div>`;
  setTimeout(() => ll1Sub('trace'), 0);
  return html;
}

function ll1Sub(mode) {
  ['trace','ff','table'].forEach(m => {
    const el = document.getElementById('stab-'+m);
    if (el) el.classList.toggle('active', m === mode);
  });
  const area = document.getElementById('ll1-content');
  if (!area) return;
  const ll1 = result.ll1 || {};
  if (mode === 'trace') {
    area.innerHTML = buildTraceTable(ll1.trace || [], ['stack','input','action']);
  } else if (mode === 'ff') {
    area.innerHTML = buildFFPanel(ll1.first, ll1.follow);
  } else {
    area.innerHTML = buildTraceTable(ll1.table || [], ['nt','terminal','production']);
  }
}

function renderLALR() {
  let html = `<div class="sec-head"><h3>LALR(1) parser</h3>
    <p>Canonical LR(0) automaton with LALR lookahead propagation. 64 grammar productions, handles full left-recursive Decaf.</p></div>
  <div class="subtabs">
    <button class="stab active" id="lstab-trace" onclick="lalrSub('trace')">Parse trace</button>
    <button class="stab" id="lstab-action" onclick="lalrSub('action')">ACTION table</button>
    <button class="stab" id="lstab-goto" onclick="lalrSub('goto')">GOTO table</button>
  </div>
  <div id="lalr-content"></div>`;
  setTimeout(() => lalrSub('trace'), 0);
  return html;
}

function lalrSub(mode) {
  ['trace','action','goto'].forEach(m => {
    const el = document.getElementById('lstab-'+m);
    if (el) el.classList.toggle('active', m === mode);
  });
  const area = document.getElementById('lalr-content');
  if (!area) return;
  const lalr = result.lalr || {};
  if (mode === 'trace')
    area.innerHTML = buildTraceTable(lalr.trace || [], ['states','symbols','input','action']);
  else if (mode === 'action')
    area.innerHTML = buildTraceTable(lalr.action || [], ['state','terminal','action']);
  else
    area.innerHTML = buildTraceTable(lalr.goto || [], ['state','nt','goto']);
}

function renderSymTable() {
  return `<div class="sec-head"><h3>Symbol table</h3>
    <p>Hash-based scoped table. Entries populated during the RD parser pass.</p></div>
  ${buildSymTable(result.rd?.symtable)}`;
}

function renderErrors() {
  const errs = result.errors || [];
  let html = `<div class="sec-head"><h3>Error report — ${errs.length} error(s)</h3>
    <p>Lexical, syntactic, and semantic errors. Panic-mode recovery applied — parser continues after each error.</p></div>`;
  if (!errs.length) {
    html += `<div class="empty-state"><i class="ti ti-circle-check" style="font-size:20px"></i> No errors — compilation successful.</div>`;
  } else {
    html += '<div class="err-list">';
    errs.forEach(e => {
      html += `<div class="err-item">
        <span class="err-type ${e.type}">${esc(e.type)}</span>
        <div>
          <span class="err-msg">${esc(e.msg)}</span>
          <span class="err-loc">line ${e.line}, col ${e.col}</span>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  if (result.raw) {
    html += `<details><summary>Raw compiler output</summary><pre>${esc(result.raw)}</pre></details>`;
  }
  return html;
}

// ── Reusable builders ──────────────────────────────────────────────────────
function buildTraceTable(rows, cols) {
  if (!rows.length) return '<div style="color:#555;font-size:13px;padding:16px 0;font-style:italic">No data.</div>';
  const LIMIT = 30;
  const id = 'tbl_' + Math.random().toString(36).slice(2);
  let html = `<div style="overflow-x:auto"><table class="dtable">
    <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
    <tbody id="${id}">`;
  rows.slice(0, LIMIT).forEach(row => {
    const r = JSON.stringify(row).toLowerCase();
    const cls = r.includes('error') ? 'row-err' : r.includes('accept') ? 'row-acc' : '';
    html += `<tr class="${cls}">${cols.map(c => `<td title="${esc(row[c]||'')}">${esc(row[c]||'')}</td>`).join('')}</tr>`;
  });
  html += `</tbody></table></div>`;
  if (rows.length > LIMIT) {
    html += `<button class="show-more-btn" onclick="expandTable('${id}', ${JSON.stringify(rows).replace(/</g,'\\u003c')}, ${JSON.stringify(cols)})">
      Show all ${rows.length} rows
    </button>`;
  }
  return html;
}

function expandTable(id, rows, cols) {
  const tbody = document.getElementById(id);
  if (!tbody) return;
  let html = '';
  rows.forEach(row => {
    const r = JSON.stringify(row).toLowerCase();
    const cls = r.includes('error') ? 'row-err' : r.includes('accept') ? 'row-acc' : '';
    html += `<tr class="${cls}">${cols.map(c => `<td title="${esc(row[c]||'')}">${esc(row[c]||'')}</td>`).join('')}</tr>`;
  });
  tbody.innerHTML = html;
  tbody.nextElementSibling?.remove();
}

function buildFFPanel(first, follow) {
  const render = (data, label) => {
    if (!data || !Object.keys(data).length) return `<div style="color:#555;font-style:italic;font-size:13px">No ${label} data.</div>`;
    let html = '<div class="ff-grid">';
    Object.entries(data).forEach(([nt, tokens]) => {
      html += `<div class="ff-card">
        <div class="ff-card-title">${label}(${esc(nt)})</div>
        <div class="ff-tags">${tokens.map(t => `<span class="ff-tag">${esc(t)}</span>`).join('')}</div>
      </div>`;
    });
    return html + '</div>';
  };
  const fid = 'ff_' + Math.random().toString(36).slice(2);
  setTimeout(() => ffToggle(fid, 'first'), 0);
  return `<div class="subtabs">
    <button class="stab active" id="${fid}-first" onclick="ffToggle('${fid}','first')">FIRST sets</button>
    <button class="stab" id="${fid}-follow" onclick="ffToggle('${fid}','follow')">FOLLOW sets</button>
  </div>
  <div id="${fid}-content"
    data-first="${esc(JSON.stringify(first||{}))}"
    data-follow="${esc(JSON.stringify(follow||{}))}"></div>`;
}

function ffToggle(fid, mode) {
  ['first','follow'].forEach(m => {
    const el = document.getElementById(`${fid}-${m}`);
    if (el) el.classList.toggle('active', m === mode);
  });
  const area = document.getElementById(`${fid}-content`);
  if (!area) return;
  const data = JSON.parse(mode === 'first' ? area.dataset.first : area.dataset.follow);
  const label = mode === 'first' ? 'FIRST' : 'FOLLOW';
  let html = '<div class="ff-grid">';
  Object.entries(data).forEach(([nt, tokens]) => {
    html += `<div class="ff-card">
      <div class="ff-card-title">${label}(${esc(nt)})</div>
      <div class="ff-tags">${tokens.map(t => `<span class="ff-tag">${esc(t)}</span>`).join('')}</div>
    </div>`;
  });
  area.innerHTML = html + '</div>';
}

function buildSymTable(entries) {
  if (!entries?.length) return '<div style="color:#555;font-size:13px;font-style:italic;padding:16px 0">No symbol table entries.</div>';
  let html = `<table class="dtable">
    <thead><tr><th>Name</th><th>Kind</th><th>Type</th><th>Line</th><th>Extra</th></tr></thead><tbody>`;
  entries.forEach(e => {
    html += `<tr>
      <td style="color:#9cdcfe">${esc(e.name)}</td>
      <td><span class="kind-badge kind-${esc(e.kind)}">${esc(e.kind)}</span></td>
      <td style="color:#4ec9b0">${esc(e.type)}</td>
      <td style="color:#858585">${esc(e.line)}</td>
      <td style="color:#555">${esc(e.extra||'')}</td>
    </tr>`;
  });
  return html + '</tbody></table>';
}
</script>
